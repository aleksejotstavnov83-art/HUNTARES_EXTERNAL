name: Build HUNTARES External APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['README.md']
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install required SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - name: Compile native ESP engine
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          cd engine
          "$ANDROID_NDK_HOME/ndk-build" -j2 NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
          test -s libs/arm64-v8a/huntares-engine
          cp libs/arm64-v8a/huntares-engine ../app/src/main/assets/bin/huntares-engine
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUNTARES-External-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
